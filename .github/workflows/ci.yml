name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SDKs
        run: bun run generate:all

      - name: Validate boundaries
        run: bun run check:boundaries

      - name: Build packages
        run: bun run build

      - name: Smoke test ESM imports
        run: |
          node -e "import('./sdk/dist/index.js').then((m)=>{if(!m.createClient) throw new Error('sdk esm missing createClient');})"
          node -e "import('./sdk-internal/dist/index.js').then((m)=>{if(!m.createClient) throw new Error('internal esm missing createClient');})"

      - name: Smoke test CommonJS requires
        run: |
          node -e "const m=require('./sdk/dist/index.cjs'); if(!m.createClient) throw new Error('sdk cjs missing createClient');"
          node -e "const m=require('./sdk-internal/dist/index.cjs'); if(!m.createClient) throw new Error('internal cjs missing createClient');"

      - name: Pack public SDK
        run: cd sdk && npm pack --dry-run

      - name: Pack internal SDK
        run: cd sdk-internal && npm pack --dry-run

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: |
            sdk/dist
            sdk-internal/dist
