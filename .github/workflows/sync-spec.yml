name: Sync OpenAPI Spec

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  sync-spec:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@v4

      - name: Fetch latest OpenAPI spec from backend
        run: |
          # Download the latest spec from the backend repo
          curl -o openapi-spec/openapi.yaml.new \
            https://raw.githubusercontent.com/BrigadaSOS/Nadeshiko/main/backend/docs/generated/openapi.yaml

      - name: Check for changes
        id: check_changes
        run: |
          if ! diff -q openapi-spec/openapi.yaml openapi-spec/openapi.yaml.new > /dev/null 2>&1; then
            echo "changed=true" >> $GITHUB_OUTPUT
            mv openapi-spec/openapi.yaml.new openapi-spec/openapi.yaml
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            rm openapi-spec/openapi.yaml.new
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync OpenAPI spec from backend'
          title: 'chore: Update OpenAPI spec from backend'
          body: |
            ## OpenAPI Spec Update

            This PR updates the vendored OpenAPI specification from the backend repository.

            ### Changes
            - Updated `openapi-spec/openapi.yaml` from backend
            - SDK will be regenerated on merge

            ### Next Steps
            1. Review the spec changes
            2. Merge this PR to trigger SDK regeneration and publishing
            3. A new version will be published to npm automatically

            ---
            🤖 Auto-generated by sync-spec workflow
          branch: chore/sync-openapi-spec
          delete-branch: true
          labels: |
            automated
            dependencies

      - name: No changes detected
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "OpenAPI spec is up to date"
